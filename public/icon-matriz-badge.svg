<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <mask id="alfa-matriz-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"></rect>
    <g transform="translate(4.48,4.48) scale(0.72)">
      <g stroke="#000" stroke-width="2.6" stroke-linecap="round">
        <path d="M16 16 L16 5.5"></path>
        <path d="M16 16 L26.5 16"></path>
        <path d="M16 16 L16 26.5"></path>
        <path d="M16 16 L5.5 16"></path>
      </g>
      <g fill="#000">
        <circle cx="16" cy="4.6" r="3"></circle>
        <circle cx="27.4" cy="16" r="3"></circle>
        <circle cx="16" cy="27.4" r="3"></circle>
        <circle cx="4.6" cy="16" r="3"></circle>
      </g>
      <!--
        O fill explícito não é redundante: este círculo está fora do grupo
        fill="#000" acima, então herdaria o fill="none" da raiz e o miolo não
        seria recortado — o badge viraria uma cruz sem o hub que identifica a
        marca. O pacote do designer vem sem ele; ao reimportar o zip, reaplicar.
      -->
      <circle cx="16" cy="16" r="5" fill="#000"></circle>
    </g>
  </mask>
  <circle cx="16" cy="16" r="16" fill="#029caf" mask="url(#alfa-matriz-cut)"></circle>
</svg>