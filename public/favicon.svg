<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 1 44 45.6" fill="none">
  <!--
    Monocromático, acompanhando o tema do navegador.

    A aba não é uma superfície nossa: um ícone de cor fixa some numa das duas.
    Com a consulta abaixo, ele fica quase-preto em aba clara e quase-branco em
    aba escura — a mesma lógica do ícone dentro do painel, que usa --ink.
  -->
  <style>
    :root { color: #171717; }
    @media (prefers-color-scheme: dark) {
      :root { color: #ededed; }
    }
  </style>
