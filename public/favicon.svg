<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 1 44 45.6" width="48" height="48" fill="none" color="#8f8f8f">
  <!--
    Monocromático e autossuficiente.

    O atributo `color` no elemento raiz é o que faz `currentColor` resolver
    mesmo onde o <style> abaixo é ignorado — o Firefox desenha favicon SVG em
    modo restrito, e sem esse padrão o ícone saía sem cor nenhuma.

    O cinza médio foi escolhido por ser legível tanto em aba clara quanto em
    escura. Onde a consulta de tema funciona, ele é substituído pelo tom certo.

    `width`/`height` explícitos: sem eles alguns navegadores não sabem em que
    tamanho rasterizar e descartam o ícone.
  -->
  <style>
    :root { color: #171717; }
    @media (prefers-color-scheme: dark) {
      :root { color: #ededed; }
    }
  </style>
  <path d="M5 4l13 15L5 34" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".38"/>
  <path d="M43 4L30 19l13 15" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".38"/>
  <circle cx="24" cy="39" r="6.6" fill="currentColor"/>
</svg>
