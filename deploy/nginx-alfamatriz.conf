# Nginx do container alfamatriz. O TLS é terminado pelo Tailscale Funnel,
# que entrega aqui em HTTP local — por isso este server block é :80.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/alfamatriz/public;
    index index.php;

    charset utf-8;

    # O painel lida com CNPJ, faturamento e financeiro: nada disso deve ser
    # indexado nem embutido em iframe de terceiro.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # .env, .git e afins nunca são servidos.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
