# Nginx do container alfamatriz. O TLS é terminado pelo túnel Cloudflare (ou
# pelo Tailscale, no acesso de emergência), que entrega aqui em HTTP local —
# por isso este server block é :80.
#
# AZUL/VERDE — a raiz servida é o symlink `atual`, nunca um diretório de
# versão. Publicar é preparar a versão que NÃO está no ar e, no fim, apontar
# esse symlink para ela. O nginx não é recarregado na troca: ele resolve o
# symlink a cada requisição.
#
# O `$realpath_root` do fastcgi_param é o que faz isso funcionar de verdade: o
# PHP recebe o caminho REAL (/var/www/alfamatriz/versoes/verde/public/index.php)
# e não o caminho pelo symlink. Sem ele, as duas versões dividiriam a mesma
# chave de opcache e a troca serviria código velho com arquivos novos.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/alfamatriz/atual/public;
    index index.php;

    charset utf-8;

    # O painel lida com CNPJ, faturamento e financeiro: nada disso deve ser
    # indexado nem embutido em iframe de terceiro.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Telemetria lida pelo painel AlfaDeploy. Fica FORA das versões porque
    # descreve a INSTALAÇÃO, não a versão: se morasse no public/ da versão, a
    # troca levaria junto o arquivo que conta como a troca foi.
    location = /deploy-status.json {
        alias /var/www/alfamatriz/deploy-status.json;
        default_type application/json;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # O disco de upload não é servido direto — nem para ler, nem para executar.
    #
    # O symlink `public/storage` é criado pelo `storage:link` de toda publicação
    # e apontava para a pasta onde caem os anexos de tarefa, de cobrança e de
    # conta a pagar. Enquanto ele foi servido, duas coisas valiam ao mesmo
    # tempo:
    #
    #   1. Todo anexo era legível por QUALQUER UM que adivinhasse o nome, sem
    #      sessão — enquanto o código dizia, e continua dizendo, que o arquivo
    #      só sai por rota com `auth` e `permissao:`. O nome tem `uniqid()` e
    #      `time()`, que são o relógio, não segredo.
    #   2. O `location ~ \.php$` abaixo casa por REGEX e alcançava também o que
    #      estivesse debaixo de /storage — então um arquivo `.php` que chegasse
    #      ao disco de upload era executado pelo PHP-FPM.
    #
    # `^~` é o que fecha as duas: essa forma vence a regex do `.php` por
    # precedência do nginx, e não só por ordem. Nenhuma tela do sistema monta
    # URL de /storage (conferido em 13/08/2026): todo arquivo passa por rota.
    location ^~ /storage/ {
        deny all;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # .env, .git e afins nunca são servidos.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Porta de ENSAIO. Serve a versão em preparo — a que ainda não está no ar —
# para que a saúde dela seja conferida ANTES de qualquer usuário ver.
#
# É o equivalente, aqui, ao que o AlfaControl faz subindo o container alvo e
# perguntando /actuator/health a ele antes de mexer no upstream do nginx.
#
# Só escuta em 127.0.0.1: quem publica está dentro do container, e uma versão
# não aprovada não pode ser alcançável de fora nem por engano.
server {
    listen 127.0.0.1:8081;
    server_name _;

    root /var/www/alfamatriz/preparo/public;
    index index.php;

    charset utf-8;

    allow 127.0.0.1;
    deny all;

    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
