; Limites de upload do PHP do AlfaMatriz.
;
; Instalado como /etc/php/8.2/{fpm,cli}/conf.d/99-alfamatriz.ini pelo
; deploy/provisionar.sh. Não editar no servidor: edite AQUI e reaplique, senão
; o servidor e o repositório divergem sem ninguém perceber.
;
; O Debian entrega 2M e 8M, e até 13/08/2026 o provisionamento não os tocava.
; O nginx já aceitava 20M — quem barrava era o PHP, três camadas abaixo, com um
; erro que não fala de tamanho: passando de post_max_size ele descarta o corpo
; INTEIRO do POST, e o Laravel responde falha de CSRF sobre um formulário que
; nunca chegou.
;
; 2M cabia enquanto a tarefa só aceitava imagem, que o navegador encolhe antes
; de enviar (US-064). Log, planilha e PDF não têm como ser encolhidos.
;
; post_max_size é maior que upload_max_filesize porque o corpo carrega os
; limites do multipart, os nomes dos campos e o token junto dos arquivos. E os
; dois ficam abaixo do client_max_body_size 20M do nginx, para que quem recusa
; seja sempre o PHP — que sabe dizer qual arquivo e de que tamanho.
upload_max_filesize = 12M
post_max_size = 16M

; Endurecimento da sessão nativa do PHP (T-580, 05/11/2026), depois do
; levantamento da falha PHP2Shell: as duas diretivas fecham caminhos que ela
; usa para plantar conteúdo num arquivo de sessão.
;
; - use_strict_mode: o PHP recusa um id de sessão que ele mesmo não criou, em
;   vez de abrir um arquivo de sessão com o nome que o atacante mandou.
; - upload_progress.enabled: desligado, um POST multipart já não grava o
;   progresso do envio (com nome de campo escolhido por quem envia) na sessão.
;   Nenhuma tela daqui usa a barra de progresso do PHP.
;
; O login não depende de nenhuma das duas: o Laravel guarda a sessão no banco
; (SESSION_DRIVER=database) e não usa a sessão nativa do PHP.
session.use_strict_mode = 1
session.upload_progress.enabled = 0
