# Instalado por deploy/provisionar.sh — edite no repositório, não aqui.
#
# Quando o host Proxmox reinicia, os containers sobem todos ao mesmo tempo e
# disputam disco e CPU. Em 03/09/2026 o php-fpm passou dos 90 s padrão sem
# avisar "pronto" ao systemd, foi morto, e — como a unit do pacote não tem
# Restart= — ficou morto até alguém entrar à mão: 16 h de 502 com nginx e
# MariaDB de pé. O cloudflared, que tem Restart=, atravessou a mesma subida
# sozinho. Mais folga para subir, e nova tentativa se ainda assim falhar.
[Service]
TimeoutStartSec=300
Restart=on-failure
RestartSec=10
